<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería Marlon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a; /* Fondo azul marino elegante */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1e293b;
        }
        .login-card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-img {
            width: 65px;  /* Logotipo más pequeño y compacto */
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid #facc15; /* Borde amarillo Caterpillar */
        }
        .login-header h1 {
            color: #111111;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .login-header p {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }
        .btn-submit {
            width: 100%;
            background-color: #111111;
            color: #facc15;
            border: none;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background-color: #262626;
        }
        .alert {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .credentials-hint {
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
            text-align: center;
            background-color: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logotipo oficial más pequeño -->
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo Ferretería Marlon" class="logo-img">
        
        <div class="login-header">
            <h1>FERRETERÍA MARLON</h1>
            <p>Ingrese sus credenciales para continuar</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="Ej. admin">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>

        <div class="credentials-hint">
            <strong>Acceso por defecto:</strong><br>
            Usuario: <code>admin</code> | Contraseña: <code>123456</code>
        </div>
    </div>

</body>
</html>
